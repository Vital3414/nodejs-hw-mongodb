type: object
required:
  - name
  - email
  - password
properties:
  _id:
    description: Users id
    type: string
    example: '65ca67e7ae7f10c88b598384'
  name:
    description: Users name
    type: string
    example: 'John Doe'
  email:
    description: Users email
    type: string
    example: 'example@mail.com'
  password:
    description: Users password
    type: string
    example: 'qwer12344321'
