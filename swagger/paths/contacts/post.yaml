tags:
  - Contacts
summary: Create contact
operationId: createContact
description: 'Create a contact with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - contactType
        properties:
          name:
            type: string
            description: 'Contacts name'
            example: 'John Doe'
          phoneNumber:
            type: string
            description: 'Contacts phone number'
            example: '+380000000090'
          email:
            type: string
            description: 'Contacts email'
            example: 'example@mail.com'
          isFavourite:
            type: boolean
            description: 'Whether the contact is marked as a favorite'
            example: false
          contactType:
            type: string
            description: 'Contacts type'
            enum: ['work', 'home', 'personal']
          photo:
            description: 'Link to contacts photo'
            type: string
            format: binary
            example: 'https://res.cloudinary.com/dtzlcxart/image/upload/v1744049115/nb2ae4glqnu7tkzyviv0.jpg'
responses:
  '201':
    description: Creates a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../components/schemas/contacts.yaml'
  '401':
    $ref: '../../components/responses/401.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
